schema_version: 1
experiment: M1b_parameter_sweep

# Keep the former B100 height/speed grid so old and new studies remain directly
# comparable. The archived D435i table is disabled under the KS2A543 baseline,
# therefore these points currently use the explicit ASSUMED fallback rather
# than measured p_selected. Re-enable empirical lookup only after a KS2A543
# B100 handoff is imported. Lane spacing remains a research control; 3.6 m also
# requires a separate flight-safety margin below the 4 m ceiling.
grid:
  altitude_m: [1.2, 1.8, 2.4, 3.0, 3.6]
  speed_mps: [0.5, 1.0, 1.5, 2.0]
  lane_spacing_m: [0.6, 0.9, 1.2, 1.5, 1.8, 2.0]
  evidence: EXPERIMENT_CONTROL

monte_carlo:
  trials: 500
  seed: 20260829
  common_random_scenarios: true

ranking:
  # Pareto objectives only. No scalar utility is asserted before real visual
  # calibration and competition scoring are connected.
  minimize: total_time_s
  maximize: mean_cue_rate
