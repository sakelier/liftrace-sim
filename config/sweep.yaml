schema_version: 1
experiment: M1b_parameter_sweep

# Height and speed axes match the authoritative V-SIM-04 B100 measurement grid,
# so every swept operating point uses measured p_selected instead of fallback.
# Lane spacing remains a research control. The 3.6 m point is below the formal
# 4 m ceiling but still requires a separate flight safety margin in deployment.
grid:
  altitude_m: [1.2, 1.8, 2.4, 3.0, 3.6]
  speed_mps: [0.5, 1.0, 1.5, 2.0]
  lane_spacing_m: [0.6, 0.9, 1.2, 1.5, 1.8, 2.0]
  evidence: EXPERIMENT_CONTROL

monte_carlo:
  trials: 500
  seed: 20260829
  common_random_scenarios: true

ranking:
  # Pareto objectives only. No scalar utility is asserted before real visual
  # calibration and competition scoring are connected.
  minimize: total_time_s
  maximize: mean_cue_rate
